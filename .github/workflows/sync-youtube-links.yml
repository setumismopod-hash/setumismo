name: Sync YouTube and Spotify links

on:
  schedule:
    # Todos los dias a las 12:30 UTC (09:30 en Chile). Los episodios salen
    # los lunes a las 11:00 UTC; correr diario cubre cualquier atraso.
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Fill pending youtubeUrl fields
        run: python3 scripts/sync-youtube-links.py --write

      - name: Fill pending spotifyUrl fields
        # Requiere los secrets SPOTIFY_CLIENT_ID y SPOTIFY_CLIENT_SECRET
        # (Settings > Secrets and variables > Actions). Si faltan, se salta.
        # Si Spotify falla, igual se guardan los links de YouTube.
        if: ${{ env.SPOTIFY_CLIENT_ID != '' }}
        continue-on-error: true
        run: python3 scripts/sync-spotify-links.py --write

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog
          git commit -m "Add YouTube/Spotify links to new blog posts"
          git push
