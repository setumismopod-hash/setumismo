name: Sync YouTube links

on:
  schedule:
    # Todos los dias a las 12:30 UTC (09:30 en Chile). Los episodios salen
    # los lunes a las 11:00 UTC; correr diario cubre cualquier atraso.
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill pending youtubeUrl fields
        run: python3 scripts/sync-youtube-links.py --write

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog
          git commit -m "Add YouTube links to new blog posts"
          git push
